name: Verify Gist
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Patch gist
        env:
          PAT: ${{ secrets.GIST_PAT }}
          LINK: ${{ secrets.GIST_LINK }}
        run: |
          set -euo pipefail
          GIST_ID="${LINK#*/}"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d '{"files":{"verify.txt":{"content":"ok"}}}')
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('/tmp/resp.json'));print('files:',list(d.get('files',{})))"
          test "$code" = "200"
          curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d '{"files":{"verify.txt":null}}'
          echo "cleanup done"
